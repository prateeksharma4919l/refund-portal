services:
  - type: web
    name: refund-portal
    env: node
    plan: free
    buildCommand: npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: CLIENT_ORIGIN
        sync: false
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_NAME
        value: Admin
      - key: ADMIN_EMAIL
        value: admin@example.com
      - key: ADMIN_USERNAME
        value: prateeksharma4919l
      - key: ADMIN_PASSWORD
        value: "1234"
